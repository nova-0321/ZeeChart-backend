name: OpenAPI contract

on:
  push:
    branches: [main]
  pull_request:

jobs:
  openapi-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fails if DTO/controller changes weren't followed by `npm run openapi:generate`.
      - run: npm run openapi:check
